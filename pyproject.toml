[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-code-openrouter-gateway"
version = "0.1.0"
description = "Anthropic-compatible Claude Code gateway backed by OpenRouter model routing."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "argon2-cffi>=23.1",
  "fastapi>=0.110",
  "httpx>=0.27",
  "mcp[cli]>=1.8",
  "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[project.scripts]
claude-gateway = "claude_gateway.main:run"
claude-mcp = "claude_gateway.mcp_server:run"

[tool.setuptools.packages.find]
include = ["claude_gateway*"]

[tool.ruff]
line-length = 100
target-version = "py311"
